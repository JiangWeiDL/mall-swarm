apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-search-deployment
  namespace: default
  labels:
    app: mall-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-search
  template:
    metadata:
      labels:
        app: mall-search
    spec:
      containers:
        - name: mall-search
          image: registrybwmpoc.azurecr.io/mall/mall-search:1.0-SNAPSHOT
          ports:
            - containerPort: 8081
          env:
            # 指定环境
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # 指定时区
            - name: TZ
              value: Asia/Shanghai
            # 指定Nacos地址
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: http://nacos-server:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: http://nacos-server:8848
            # 覆盖 Nacos 中的数据库地址
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "root"
            # 覆盖 Nacos 中的 Redis 地址 (Spring Boot 3 的规范)
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_ELASTICSEARCH_URIS
              value: "http://elasticsearch:9200"
          startupProbe:
            tcpSocket:
              port: 8081         # 👈 注意这里：port 必须在 tcpSocket 下面，缩进要对齐
            failureThreshold: 30 # 和 tcpSocket 对齐
            periodSeconds: 10    # 和 tcpSocket 对齐
