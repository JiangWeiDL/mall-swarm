apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-monitor-deployment
  namespace: default
  labels:
    app: mall-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-monitor
  template:
    metadata:
      labels:
        app: mall-monitor
    spec:
      containers:
        - name: mall-monitor
          image: registrybwmpoc.azurecr.io/mall/mall-monitor:1.0-SNAPSHOT
          ports:
            - containerPort: 8101
          env:
            # 指定环境
            - name: spring.profiles.active
              value: prod
            # 指定时区
            - name: TZ
              value: Asia/Shanghai
            # 指定Nacos地址
            - name: spring.cloud.nacos.discovery.server-addr
              value: http://nacos-server:8848
            - name: spring.cloud.nacos.config.server-addr
              value: http://nacos-server:8848